<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; background: var(--bg);">
    <div class="reg-corners" style="max-width: 500px; width: 100%; text-align: center; padding: 40px 24px; border: var(--micro-border); background: var(--micro-bg-card); position: relative;">
      <div class="corner-ticks"></div>
      <div class="micro-header-bar" style="margin-bottom: 20px;">
        <span class="tag-id">STATUS: 404</span>
        <span class="telemetry-val">INVALID ROUTE</span>
      </div>
      <h1 style="font-size: 48px; font-weight: 800; color: var(--accent); margin-bottom: 12px; font-family: var(--font-mono);">404</h1>
      <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 24px; line-height: 1.6;">
        The requested system endpoint does not exist or has been relocated within the architecture.
      </p>
      <a href="index.html" class="btn-sharp solid" style="justify-content: center; width: 100%;">
        <span>[ RETURN TO HOME ]</span>
        <span>&rarr;</span>
      </a>
    </div>
  </body>
</html>
